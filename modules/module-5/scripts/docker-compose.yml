# Prometheus, reading the /metrics page that metrics_server.py serves on
# your machine. Needs Docker Desktop (or Docker Engine on Linux).
#
#   python3 metrics_server.py &
#   docker compose up -d
#   Prometheus  http://localhost:9090
#
#   docker compose down        when you are finished for the day

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: module5-prometheus
    ports: ["9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Linux reach your machine too
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
